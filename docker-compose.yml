version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_REDIS_URL: redis://redis:6379/0
      APP_STORAGE_BACKEND: ${APP_STORAGE_BACKEND:-local}
      APP_STORAGE_LOCAL_PATH: /app/storage
      APP_JWT_SECRET_KEY: ${APP_JWT_SECRET_KEY:?set APP_JWT_SECRET_KEY in .env}
      APP_API_KEY_REQUIRED: ${APP_API_KEY_REQUIRED:-false}
      APP_API_KEYS: ${APP_API_KEYS:-}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-*}
      APP_SPEECH_PROVIDER: ${APP_SPEECH_PROVIDER:-local}
      APP_AZURE_SPEECH_KEY: ${APP_AZURE_SPEECH_KEY:-}
      APP_AZURE_SPEECH_REGION: ${APP_AZURE_SPEECH_REGION:-}
      APP_IMAGE_RECOGNITION_PROVIDER: ${APP_IMAGE_RECOGNITION_PROVIDER:-local}
      APP_AZURE_CV_ENDPOINT: ${APP_AZURE_CV_ENDPOINT:-}
      APP_AZURE_CV_KEY: ${APP_AZURE_CV_KEY:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_storage:/app/storage
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      GW_ENV: ${GW_ENV:-production}
      GW_LOG_LEVEL: ${GW_LOG_LEVEL:-INFO}
      GW_REDIS_URL: redis://redis:6379/1
      GW_UPSTREAM_BASE_URL: http://app:8000
      GW_JWT_SECRET_KEY: ${GW_JWT_SECRET_KEY:?set GW_JWT_SECRET_KEY in .env}
      GW_CORS_ORIGINS: ${GW_CORS_ORIGINS:-*}
      GW_API_KEYS: ${GW_API_KEYS:-}
      GW_API_KEY_REQUIRED: ${GW_API_KEY_REQUIRED:-false}
    ports:
      - "${GW_PORT:-8001}:8001"
    command: [
      "gunicorn", "gateway.main:app",
      "--worker-class", "uvicorn.workers.UvicornWorker",
      "--workers", "4",
      "--bind", "0.0.0.0:8001",
      "--timeout", "60",
      "--graceful-timeout", "30",
      "--keep-alive", "5",
      "--max-requests", "10000",
      "--max-requests-jitter", "1000",
      "--access-logfile", "-",
      "--error-logfile", "-"
    ]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  intent:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      INTENT_ENV: ${INTENT_ENV:-production}
      INTENT_LOG_LEVEL: ${INTENT_LOG_LEVEL:-INFO}
      INTENT_REDIS_URL: redis://redis:6379/2
      INTENT_BACKEND: ${INTENT_BACKEND:-rules}
      INTENT_MODEL_NAME_OR_PATH: ${INTENT_MODEL_NAME_OR_PATH:-bert-base-multilingual-cased}
      INTENT_MODEL_DEVICE: ${INTENT_MODEL_DEVICE:-cpu}
      INTENT_PRELOAD_MODEL: ${INTENT_PRELOAD_MODEL:-false}
      INTENT_ALLOW_RULES_FALLBACK: ${INTENT_ALLOW_RULES_FALLBACK:-true}
      INTENT_API_KEY_REQUIRED: ${INTENT_API_KEY_REQUIRED:-false}
      INTENT_API_KEYS: ${INTENT_API_KEYS:-}
      INTENT_CORS_ORIGINS: ${INTENT_CORS_ORIGINS:-*}
    ports:
      - "${INTENT_PORT:-8002}:8002"
    command: [
      "gunicorn", "intent.main:app",
      "--worker-class", "uvicorn.workers.UvicornWorker",
      "--workers", "2",
      "--bind", "0.0.0.0:8002",
      "--timeout", "60",
      "--graceful-timeout", "30",
      "--access-logfile", "-",
      "--error-logfile", "-"
    ]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  decision:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DECISION_ENV: ${DECISION_ENV:-production}
      DECISION_LOG_LEVEL: ${DECISION_LOG_LEVEL:-INFO}
      DECISION_REDIS_URL: redis://redis:6379/3
      DECISION_STRATEGY: ${DECISION_STRATEGY:-ensemble}
      DECISION_ML_MODEL_KIND: ${DECISION_ML_MODEL_KIND:-dummy}
      DECISION_ML_MODEL_PATH: ${DECISION_ML_MODEL_PATH:-}
      DECISION_ML_DEVICE: ${DECISION_ML_DEVICE:-cpu}
      DECISION_ALLOW_RULES_FALLBACK: ${DECISION_ALLOW_RULES_FALLBACK:-true}
      DECISION_PRELOAD_MODEL: ${DECISION_PRELOAD_MODEL:-false}
      DECISION_MAX_AUTO_APPROVE_AMOUNT: ${DECISION_MAX_AUTO_APPROVE_AMOUNT:-50000}
      DECISION_REQUIRE_HUMAN_REVIEW_ABOVE: ${DECISION_REQUIRE_HUMAN_REVIEW_ABOVE:-100000}
      DECISION_API_KEY_REQUIRED: ${DECISION_API_KEY_REQUIRED:-false}
      DECISION_API_KEYS: ${DECISION_API_KEYS:-}
      DECISION_CORS_ORIGINS: ${DECISION_CORS_ORIGINS:-*}
    ports:
      - "${DECISION_PORT:-8003}:8003"
    command: [
      "gunicorn", "decision.main:app",
      "--worker-class", "uvicorn.workers.UvicornWorker",
      "--workers", "2",
      "--bind", "0.0.0.0:8003",
      "--timeout", "60",
      "--graceful-timeout", "30",
      "--access-logfile", "-",
      "--error-logfile", "-"
    ]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
  app_storage:
  app_logs:
