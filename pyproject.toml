[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ilbuyai-input-processor"
version = "1.0.0"
description = "Multi-modal input processing service for ILBuyAI (Part 1/10)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests", "gateway_tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = [
    "api",
    "cache",
    "config",
    "core",
    "entities",
    "gateway",
    "managers",
    "processors",
    "services",
    "storage",
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
